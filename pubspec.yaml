name: picsync_app
description: "A new Flutter project."

version: 0.0.5+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  provider: ^6.1.5
  path_provider: ^2.1.5
  drift: ^2.31.0
  image_picker: ^1.2.1
  flutter_svg: ^2.2.3
  shared_preferences: ^2.5.4
  photo_manager: ^3.8.3
  crypto: ^3.0.7
  path: ^1.9.1
  collection: ^1.19.1
  photo_view: ^0.15.0
  transparent_image: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  mutex: ^3.1.0
  drift_flutter: ^0.2.8
  photo_manager_image_provider: ^2.2.0
  flutter_staggered_grid_view: ^0.7.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.17.0
  build_runner: ^2.4.8


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/welcome_screen/
    - assets/app_icon/

flutter_icons:
  android: true
  ios: true
  image_path_ios: "assets/app_icon/png/PicSync_AppIcon.png"
  image_path_android: "assets/app_icon/png/PicSync_AppIcon_transparent.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon/png/PicSync_AppIcon_transparent.png"
  adaptive_icon_monochrome: "assets/app_icon/png/PicSync_AppIcon_monochrome.png"
